name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check
        run: npm run check
      - name: Verify package contents
        run: npm pack --dry-run --json > pack.json
      - name: Upload package manifest
        if: always() && matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: npm-pack-manifest
          path: pack.json

  python-scanner:
    name: Python ${{ matrix.python }} scanner contract
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false
      - name: Scanner smoke test
        run: |
          printf '{"mode":"environment","root":"."}\n' | python3 helpers/scan_project.py > environment.json
          python3 -c "import json,sys; data=json.load(open('environment.json')); assert data['tomlAvailable'] is True, data"
          python3 -c "import json,sys; data=json.load(open('environment.json')); assert data['environment']['version'].startswith('3.'), data"
      - name: Run scanner integration tests
        run: npx tsx --test test/scanner-integration.test.ts

  extension-smoke:
    name: pi extension smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install pi CLI
        run: npm install --global @earendil-works/pi-coding-agent
      - name: Load extension
        run: pi -e ./extensions/index.ts --list-models
