name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check (tests, types, format, package contents)
        run: npm run check
      - name: Verify package contents
        run: npm pack --dry-run --json > pack.json
      - name: Upload package manifest
        if: always() && matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: npm-pack-manifest
          path: pack.json

  python-scanner:
    name: Python ${{ matrix.python }} scanner contract
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false
      - name: Provide the optional analyser packages
        # tomllib needs a backport before 3.11, and constraint comparison needs
        # packaging. Installing both keeps the strong assertions covered.
        run: python -m pip install tomli packaging
      - name: Scanner CLI contract
        run: |
          python3 helpers/scan_project.py --help >/dev/null
          python3 helpers/scan_project.py --version >/dev/null
          printf '{"mode":"environment","root":"."}' | python3 helpers/scan_project.py > environment.json
          python3 - <<'PY'
          import json
          document = json.load(open('environment.json'))
          assert document['scannerVersion'] == 1, document
          assert document['tomlAvailable'] is True, document
          assert document['environment']['version'].startswith('3.'), document
          PY
      - name: Scanner exit-code contract
        run: |
          set +e
          printf 'not json' | python3 helpers/scan_project.py >/dev/null 2>&1
          code=$?
          set -e
          if [ "$code" -ne 2 ]; then
            echo "expected exit 2 for invalid input, got $code" >&2
            exit 1
          fi
      - name: Scanner regression tests
        run: |
          npx tsx --test test/helper-cli.test.ts
          npx tsx --test test/scanner-integration.test.ts
          # Enforced here rather than in the Node jobs because capturing return
          # shapes needs both python3 and uv.
          npx tsx --test test/api-surface.test.ts

  extension-smoke:
    name: pi extension smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install pi CLI
        run: npm install --global @earendil-works/pi-coding-agent
      - name: Load extension
        run: pi -e ./extensions/index.ts --list-models
