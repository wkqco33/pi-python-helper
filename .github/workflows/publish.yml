name: Publish npm package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm with provenance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Remove token config for Trusted Publishing
        run: sed -i '/_authToken/d' "$NPM_CONFIG_USERCONFIG"
      - name: Upgrade npm for Trusted Publishing
        run: npm install --global npm@latest
      - name: Show runtime versions
        run: node --version && npm --version
      - name: Install dependencies
        run: npm ci
      - name: Verify release
        run: npm run check
      - name: Verify version matches tag
        shell: bash
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [[ "$version" != "${GITHUB_REF_NAME}" ]]; then
            echo "package.json version $version does not match release tag ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
      - name: Publish with npm Trusted Publishing
        run: env -u NODE_AUTH_TOKEN npm publish --provenance --access public
